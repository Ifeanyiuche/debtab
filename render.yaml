services:
  - type: web
    name: debtab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn debtab.wsgi --workers 2 --log-file -
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: debtab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: debtab-db
    plan: free
