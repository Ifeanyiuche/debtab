{% extends "base.html" %}
{% block title %}Password Updated — DebTab{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 text-center">
        <div class="mb-3"><i class="bi bi-check-circle-fill text-success" style="font-size:3rem;"></i></div>
        <h2 class="fw-bold mb-2">Password updated!</h2>
        <p class="text-muted">Your password has been set. You can now log in with your new credentials.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-2">Log In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
