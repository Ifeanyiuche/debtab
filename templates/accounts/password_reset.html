{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Reset Password — DebTab{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="card-title mb-1 fw-bold text-center"><i class="bi bi-key text-primary"></i> Reset Password</h2>
        <p class="text-muted small text-center mb-4">Enter your email address and we'll send you a link to reset your password.</p>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Send Reset Link</button>
        </form>
        <hr>
        <p class="text-center text-muted small mb-0"><a href="{% url 'login' %}">Back to Log In</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
