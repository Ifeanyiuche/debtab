{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Log In — DebTab{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="card-title mb-4 text-center fw-bold"><i class="bi bi-box-arrow-in-right text-primary"></i> Tab Master Login</h2>
        <form method="post">
          {% csrf_token %}
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Log In</button>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'password_reset' %}" class="small text-muted">Forgot your password?</a>
        </div>
        <hr>
        <p class="text-center text-muted small mb-0">No account? <a href="{% url 'register' %}">Register here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
