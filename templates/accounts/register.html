{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Register — DebTab{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="card-title mb-4 text-center fw-bold"><i class="bi bi-person-plus text-primary"></i> Create Tab Master Account</h2>
        <form method="post">{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-primary w-100 mt-2">Create Account</button></form>
        <hr><p class="text-center text-muted small">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
