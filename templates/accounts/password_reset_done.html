{% extends "base.html" %}
{% block title %}Check Your Email — DebTab{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 text-center">
        <div class="mb-3"><i class="bi bi-envelope-check-fill text-success" style="font-size:3rem;"></i></div>
        <h2 class="fw-bold mb-2">Check your inbox</h2>
        <p class="text-muted">If an account exists for that email address, a password reset link has been sent. Check your spam folder if you don't see it.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary mt-2">Back to Log In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
