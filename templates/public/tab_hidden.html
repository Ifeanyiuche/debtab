{% extends "base.html" %}
{% block title %}Tab Not Released — {{ tournament.name }}{% endblock %}
{% block content %}
<div class="text-center mt-5">
  <i class="bi bi-lock-fill fs-1 text-muted"></i>
  <h3 class="mt-3">Tab Not Released Yet</h3>
  <p class="text-muted">The tab master has not released the tab for {{ tournament.name }} yet.</p>
  <a href="{% url 'public_overview' slug=tournament.slug %}" class="btn btn-outline-primary">Back to Tournament</a>
</div>
{% endblock %}
