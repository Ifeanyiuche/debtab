{% extends "base.html" %}
{% block title %}Add Motion{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <h3 class="fw-bold mb-4">Add Motion — {{ round.name }}</h3>
  <div class="card border-0 shadow-sm"><div class="card-body p-4">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Reference</label><input type="text" name="reference" class="form-control"></div>
      <div class="mb-3"><label class="form-label fw-semibold">Motion Text</label><textarea name="text" class="form-control" rows="3" required></textarea></div>
      <div class="mb-3"><label class="form-label">Info Slide</label><textarea name="info_slide" class="form-control" rows="2"></textarea></div>
      <button type="submit" class="btn btn-primary">Add Motion</button>
      <a href="{% url 'motion_list' slug=tournament.slug round_seq=round.seq %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
