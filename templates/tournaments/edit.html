{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edit {{ tournament.name }} — DebTab{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h2 class="fw-bold mb-4"><i class="bi bi-gear text-secondary"></i> Tournament Settings</h2>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-primary mt-2">Save Changes</button></form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
