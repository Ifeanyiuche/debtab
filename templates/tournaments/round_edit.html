{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edit Round — {{ tournament.name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h2 class="fw-bold mb-4"><i class="bi bi-pencil text-warning"></i> Edit {{ round.name }}</h2>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-primary mt-2">Save</button> <a href="{% url 'tournament_overview' slug=tournament.slug %}" class="btn btn-outline-secondary mt-2">Cancel</a></form>
      </div>
    </div>
    <div class="mt-3 text-end">
      <form method="post" action="{% url 'round_delete' slug=tournament.slug round_seq=round.seq %}">{% csrf_token %}<button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this round?')"><i class="bi bi-trash"></i> Delete Round</button></form>
    </div>
  </div>
</div>
{% endblock %}
