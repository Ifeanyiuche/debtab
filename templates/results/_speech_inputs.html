{% comment %}Reusable speech-input block for a single team card. Vars: pos, td{% endcomment %}
<!-- Speech 1 -->
<div class="mb-3 speech-row" data-speech="1">
  <div class="d-flex align-items-center gap-2 mb-1">
    <label class="form-label fw-semibold mb-0 flex-grow-1">Speech 1</label>
    <div class="form-check form-switch mb-0 ironman-toggle" id="ironman_toggle_{{ pos }}_1" style="display:none;">
      <input class="form-check-input ironman-check" type="checkbox" name="ironman_{{ pos }}_1"
             id="ironman_{{ pos }}_1" {% if td.score_1 and td.score_1.ironman %}checked{% endif %}>
      <label class="form-check-label text-danger small" for="ironman_{{ pos }}_1">
        <i class="bi bi-shield-exclamation"></i> Ironman
      </label>
    </div>
  </div>
  <div class="row g-2">
    <div class="col-8">
      <select name="speaker_{{ pos }}_1" class="form-select speaker-select" data-pos="{{ pos }}" data-speech="1">
        <option value="">— Select speaker —</option>
        {% for spk in td.speakers %}
        <option value="{{ spk.pk }}"
          {% if td.score_1 and td.score_1.speaker and td.score_1.speaker.pk == spk.pk and not td.score_1.ironman %}selected{% endif %}>
          {{ spk.name }}
        </option>
        {% endfor %}
        <option value="ironman" {% if td.score_1 and td.score_1.ironman %}selected{% endif %}>Ironman</option>
      </select>
    </div>
    <div class="col-4">
      <input type="number" name="score_{{ pos }}_1" class="form-control score-input"
             min="{{ tournament.speaker_score_min }}" max="{{ tournament.speaker_score_max }}"
             step="0.5" placeholder="Score"
             value="{% if td.score_1 %}{{ td.score_1.score }}{% endif %}" required>
    </div>
  </div>
</div>

<!-- Speech 2 -->
<div class="mb-3 speech-row" data-speech="2">
  <div class="d-flex align-items-center gap-2 mb-1">
    <label class="form-label fw-semibold mb-0 flex-grow-1">Speech 2</label>
    <div class="form-check form-switch mb-0 ironman-toggle" id="ironman_toggle_{{ pos }}_2" style="display:none;">
      <input class="form-check-input ironman-check" type="checkbox" name="ironman_{{ pos }}_2"
             id="ironman_{{ pos }}_2" {% if td.score_2 and td.score_2.ironman %}checked{% endif %}>
      <label class="form-check-label text-danger small" for="ironman_{{ pos }}_2">
        <i class="bi bi-shield-exclamation"></i> Ironman
      </label>
    </div>
  </div>
  <div class="row g-2">
    <div class="col-8">
      <select name="speaker_{{ pos }}_2" class="form-select speaker-select" data-pos="{{ pos }}" data-speech="2">
        <option value="">— Select speaker —</option>
        {% for spk in td.speakers %}
        <option value="{{ spk.pk }}"
          {% if td.score_2 and td.score_2.speaker and td.score_2.speaker.pk == spk.pk and not td.score_2.ironman %}selected{% endif %}>
          {{ spk.name }}
        </option>
        {% endfor %}
        <option value="ironman" {% if td.score_2 and td.score_2.ironman %}selected{% endif %}>Ironman</option>
      </select>
    </div>
    <div class="col-4">
      <input type="number" name="score_{{ pos }}_2" class="form-control score-input"
             min="{{ tournament.speaker_score_min }}" max="{{ tournament.speaker_score_max }}"
             step="0.5" placeholder="Score"
             value="{% if td.score_2 %}{{ td.score_2.score }}{% endif %}" required>
    </div>
  </div>
</div>

<!-- Team total and rank -->
<div class="d-flex justify-content-between align-items-center mt-2 p-2 bg-light rounded">
  <div>
    <span class="text-muted small">Total: </span>
    <span class="fw-bold team-total" id="total_{{ pos }}">—</span>
  </div>
  <div>
    <label class="form-label mb-0 small text-muted me-2">Rank:</label>
    <select name="rank_{{ pos }}" class="form-select form-select-sm rank-select d-inline-block"
            style="width:70px;" id="rank_{{ pos }}">
      <option value="">—</option>
      <option value="1" {% if td.debate_team.rank == 1 %}selected{% endif %}>1st</option>
      <option value="2" {% if td.debate_team.rank == 2 %}selected{% endif %}>2nd</option>
      <option value="3" {% if td.debate_team.rank == 3 %}selected{% endif %}>3rd</option>
      <option value="4" {% if td.debate_team.rank == 4 %}selected{% endif %}>4th</option>
    </select>
  </div>
</div>
