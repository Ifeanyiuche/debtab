{% extends "base.html" %}
{% block title %}Delete {{ type }} — DebTab{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 text-center">
    <div class="card border-danger border-0 shadow-sm">
      <div class="card-body p-4">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
        <h4 class="mt-3">Delete {{ type }}</h4>
        <p class="text-muted">Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
        <form method="post">{% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
          <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
