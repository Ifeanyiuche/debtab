{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ action }} Team — {{ tournament.name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h3 class="fw-bold mb-4"><i class="bi bi-shield-shaded text-primary"></i> {{ action }} Team</h3>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-primary mt-2">{{ action }} Team</button> <a href="{% url 'team_list' slug=tournament.slug %}" class="btn btn-outline-secondary mt-2">Cancel</a></form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
